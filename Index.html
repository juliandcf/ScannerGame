<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Bazar</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --main-color: #e63946; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #000; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Pantalla de Configuración */
        #config-screen {
            position: fixed; inset: 0; background: #1a1a1a; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
        }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-size: 1.1rem; }
        .start-btn { background: #2a9d8f; color: white; border: none; padding: 20px; width: 100%; border-radius: 15px; font-size: 1.3rem; font-weight: bold; margin-top: 20px; }

        /* Interfaz de Juego */
        .header { background: var(--main-color); padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; text-transform: uppercase; }
        #reader { width: 100%; flex-grow: 1; background: #000; }
        
        .bottom-panel { background: #1a1a1a; padding: 20px; border-top: 4px solid var(--main-color); }
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1rem; color: #aaa; }
        #price-display { 
            background: #000; color: #00ff00; font-family: monospace; 
            font-size: 2.2rem; text-align: center; padding: 15px; border-radius: 10px;
            border: 1px solid #333; min-height: 80px; display: flex; align-items: center; justify-content: center;
        }
        .finish-btn { background: #2a9d8f; border: none; color: white; padding: 15px; border-radius: 10px; font-size: 1.2rem; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="config-screen">
        <h1 style="color:var(--main-color)">🏪 MI BAZAR</h1>
        <input type="text" id="store-name" placeholder="Nombre del negocio...">
        <p>Elegí el color del local:</p>
        <input type="color" id="store-color" value="#e63946">
        <button class="start-btn" onclick="startGame()">¡ABRIR LOCAL!</button>
    </div>

    <div class="header" id="header-bg">---</div>
    <div id="reader"></div>

    <div class="bottom-panel">
        <div class="stats">
            <span>PRODUCTOS: <span id="item-count" style="color:#0f0">0</span></span>
            <span id="last-code" style="font-size: 0.7rem;"></span>
        </div>
        <div id="price-display">ESPERANDO...</div>
        <button class="finish-btn" onclick="finish()">COBRAR (TOTAL)</button>
    </div>

    <script>
        let count = 0;
        let lastScan = 0;
        let scanner;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function startGame() {
            const name = document.getElementById('store-name').value || "MI BAZAR";
            const color = document.getElementById('store-color').value;
            document.getElementById('header-bg').innerText = name;
            document.getElementById('header-bg').style.backgroundColor = color;
            document.documentElement.style.setProperty('--main-color', color);
            document.getElementById('config-screen').style.display = 'none';
            initCamera();
        }

        function playPip() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            if (navigator.vibrate) navigator.vibrate(80);
        }

        function initCamera() {
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                (text) => {
                    let now = Date.now();
                    if (now - lastScan > 2000) {
                        count++;
                        playPip();
                        document.getElementById('item-count').innerText = count;
                        document.getElementById('price-display').innerText = "¡PIP!";
                        lastScan = now;
                        setTimeout(() => { if(count > 0) document.getElementById('price-display').innerText = "ESCANEANDO..."; }, 1000);
                    }
                }
            ).catch(err => alert("Error de cámara: " + err));
        }

        function finish() {
            if (count === 0) return;
            const total = (Math.random() * (10000 - 1500) + 1500) * count * 0.8;
            const pesos = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(total);
            document.getElementById('price-display').innerText = pesos;
            count = 0;
            document.getElementById('item-count').innerText = "0";
        }
    </script>
</body>
</html>
